name    = disbatch
author  = Ashley Willis <ashleyw@cpan.org>
license = Apache_2_0
copyright_holder = Matt Busigin, Ashley Willis, others
copyright_year   = 2011	; mad that dzil insists this is an integer and not a string
main_module = lib/Disbatch.pm

[Git::Init]
[NextRelease]	; before Git::Commit
[Git::NextVersion]
[Run::BeforeBuild]	; build prebuilt/go-task-runner-* for each platform, failing on any `gofmt -l` or `go vet` output, before gathering them below
run = dev/build-go-task-runner
[Git::GatherDir]
exclude_match = ^web/
[GatherDir / GoTaskRunner]	; the built prebuilt/go-task-runner-*, as they are not in git
root = prebuilt
prefix = prebuilt
[@Git]		; Git::Check, Git::Commit, Git::Tag, Git::Push
push_to = origin
[@Filter / Basic]	; GatherDir, PruneCruft, ManifestSkip, MetaYAML, License, Readme, ExtraTests, ExecDir,
-bundle = @Basic	; ShareDir, MakeMaker, Manifest, TestRelease, ConfirmRelease, UploadToCPAN
-remove = GatherDir
-remove = MakeMaker
-remove = UploadToCPAN
[MakeMaker::Awesome]	; in place of MakeMaker, so Makefile.PL also installs prebuilt/go-task-runner-* for its platform as go-task-runner
header_file = dev/Makefile.PL-header
WriteMakefile_arg = EXE_FILES => [ @{ $WriteMakefileArgs{EXE_FILES} || [] }, @go_task_runner ]
WriteMakefile_arg = clean => { FILES => 'go-task-runner' }
[PkgVersion]	; add a $VERSION to your packages
die_on_existing_version = 1
[PodVersion]	; add a VERSION head1 to each Perl document
[MetaJSON]
[AutoPrereqs]	; automatically extract prereqs from your modules
skip = ^Template$
[Prereqs / RuntimeSuggests]
Template = 0
Template::Plugin::SimpleJson = 0
[Prereqs]	; WARNING: anything added here also needs to be in dist.spec under 'Requires:'. if you just need a specific version of of something with a 'use' in lib/, add it to the 'use' statement instead.
Limper::Engine::PSGI = 0
Starwoman = 0
[MetaProvides::Package]
[Repository]
sh_to_https = 1
[RPM]
spec_file = dist.spec
sign = 0
ignore_build_deps = 0

push_packages = 0
push_command = /home/awillis/bin/release
push_ignore_packages = .src.rpm$
