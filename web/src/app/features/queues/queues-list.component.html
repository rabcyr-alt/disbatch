<mat-toolbar>
  <span>Queues</span>
  <span class="spacer"></span>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    New Queue
  </button>
</mat-toolbar>

<div class="table-card">
  <table mat-table [dataSource]="queues()" class="full-width">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let q" class="mono">{{ q.id }}</td>
    </ng-container>

    <ng-container matColumnDef="plugin">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let q">
        <mat-form-field appearance="outline" class="inline">
          <mat-select [value]="q.plugin" (selectionChange)="onEdit(q, 'plugin', $event.value)">
            @for (p of plugins(); track p) {
              <mat-option [value]="p">{{ p }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let q">
        <mat-form-field appearance="outline" class="inline">
          <input matInput [value]="q.name" (change)="onEdit(q, 'name', $any($event.target).value)" />
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="threads">
      <th mat-header-cell *matHeaderCellDef>Threads</th>
      <td mat-cell *matCellDef="let q">
        <mat-form-field appearance="outline" class="inline narrow">
          <input
            matInput
            type="number"
            min="0"
            [value]="q.threads === null ? '' : q.threads"
            (change)="onEdit(q, 'threads', $any($event.target).value)"
          />
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="queued">
      <th mat-header-cell *matHeaderCellDef>Queued</th>
      <td mat-cell *matCellDef="let q">{{ q.queued }}</td>
    </ng-container>

    <ng-container matColumnDef="running">
      <th mat-header-cell *matHeaderCellDef>Running</th>
      <td mat-cell *matCellDef="let q">{{ q.running }}</td>
    </ng-container>

    <ng-container matColumnDef="completed">
      <th mat-header-cell *matHeaderCellDef>Completed</th>
      <td mat-cell *matCellDef="let q">{{ q.completed }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let q">
        <button mat-icon-button color="warn" (click)="confirmDelete(q)" matTooltip="Delete queue">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!loading() && queues().length === 0) {
    <div class="empty">No queues.</div>
  }
</div>
